databases:
  - name: tickethub-db
    plan: free

services:
  - type: web
    name: tickethub
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: tickethub.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://tickethub.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: tickethub-db
          property: connectionString
