<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – LANESRA</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="{% static 'images/lansera1.jpg' %}" alt="LANESRA">    </div>
    <p class="login-eyebrow">Ticketing Portal · Secure Access</p>

    {% if messages %}
    <ul class="messages">
      {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
    </ul>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;">
        Access Dashboard
      </button>
    </form>
    <p style="text-align:center; font-size:10px; color:var(--cream); opacity:0.25; margin-top:1.8rem; letter-spacing:0.1em;">
      LANESRA · Premium Events & Entertainment
    </p>
  </div>
</div>
</body>
</html>
