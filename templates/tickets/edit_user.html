{% extends 'tickets/base.html' %}
{% block title %}Edit User{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">Edit User: {{ edited_user.username }}</h1>
  <a href="{% url 'user_management' %}" style="color:var(--text3); font-size:13px;">← Back to users</a>
</div>
<div style="max-width:520px;">
  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username *</label>
        <input type="text" name="username" class="form-control" value="{{ form.username.value|default:'' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ form.email.value|default:'' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Role *</label>
        <select name="role" class="form-control">
          {% for val, label in form.fields.role.choices %}
          <option value="{{ val }}" {% if form.fields.role.initial == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" name="is_active" {% if form.is_active.value %}checked{% endif %}>
          <span class="form-label" style="margin:0;">Account Active</span>
        </label>
      </div>
      <div style="display:flex; gap:8px;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'user_management' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
