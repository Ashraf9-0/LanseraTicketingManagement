{% extends 'tickets/base.html' %}
{% block title %}Edit User – LANESRA{% endblock %}
{% block content %}

<a href="{% url 'user_management' %}" class="back-btn">← Users</a>
<div class="page-header">
  <p style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);margin-bottom:6px;">Admin</p>
  <h1 class="page-title">Edit: {{ edited_user.username }}</h1>
  <a href="{% url 'user_management' %}" style="font-size:11px;opacity:.5;">← Back to users</a>
</div>
<div style="max-width:540px;">
  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username *</label>
        <input type="text" name="username" class="form-control" value="{{ form.username.value|default:'' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ form.email.value|default:'' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Role *</label>
        <select name="role" class="form-control">
          {% for val, label in form.fields.role.choices %}
          <option value="{{ val }}" {% if form.fields.role.initial == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <input type="checkbox" name="is_active" {% if form.is_active.value %}checked{% endif %}
            style="width:16px;height:16px;accent-color:var(--mint);">
          <span class="form-label" style="margin:0;">Account Active</span>
        </label>
      </div>
        <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'change_user_password' edited_user.pk %}" class="btn btn-secondary">Change Password</a>
        <a href="{% url 'user_management' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
