{% if page_obj.paginator.num_pages > 1 %}
<div style="display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:1.5rem 0;">
  {% if page_obj.has_previous %}
    <a href="?page=1{% if querystring %}&{{ querystring }}{% endif %}" class="btn btn-secondary btn-sm">« First</a>
    <a href="?page={{ page_obj.previous_page_number }}{% if querystring %}&{{ querystring }}{% endif %}" class="btn btn-secondary btn-sm">‹ Prev</a>
  {% endif %}

  <span style="font-size:12px;opacity:.6;padding:0 10px;">
    Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
    <span style="opacity:.6;">· {{ page_obj.paginator.count }} total</span>
  </span>

  {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}{% if querystring %}&{{ querystring }}{% endif %}" class="btn btn-secondary btn-sm">Next ›</a>
    <a href="?page={{ page_obj.paginator.num_pages }}{% if querystring %}&{{ querystring }}{% endif %}" class="btn btn-secondary btn-sm">Last »</a>
  {% endif %}
</div>
{% endif %}
